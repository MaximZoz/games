name: CI

# Автопрогон: только после влития в main (push).
# На PR и develop не стартует — минуты Actions уходят на деплой.
# Локально: ./launcher/test.sh (или команды из README).
# Вручную: Actions → CI → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Совпадает с AGENTS.md / локальным SDK; floating stable тянет новые deprecation.
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: |
          if [ -d test ]; then
            flutter test --no-pub
          else
            echo "No test directory, skipping tests"
          fi

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Download deps
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
