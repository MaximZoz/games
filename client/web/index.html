<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="multigames_client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>multigames_client</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }
    body {
      background-color: #F5F5F5;
      touch-action: pan-y;
    }
    flt-glass-pane, flutter-view {
      display: block;
      width: 100%;
      height: 100%;
    }
    flt-glass-pane canvas, flutter-view canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      let startX = 0;
      let startY = 0;
      document.addEventListener('touchstart', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const x = e.touches[0].clientX;
        startX = x;
        startY = e.touches[0].clientY;
        // Блокируем системный свайп "назад/вперёд" от краёв экрана на iOS.
        if (x <= 24 || x >= window.innerWidth - 24) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchmove', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 && dx > dy) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      // iOS Safari часто игнорирует autocomplete=off и рисует панель
      // Passwords / Payment / Locations над клавиатурой. Усиливаем атрибуты
      // только для полей, которые Flutter уже пометил как autocomplete=off
      // (поиск друзей и т.п.) — логин/пароль не трогаем.
      function hardenOffAutofill(el) {
        if (!el || el.nodeType !== 1) return;
        const tag = el.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') return;
        const type = (el.getAttribute('type') || 'text').toLowerCase();
        if (type === 'password' || type === 'email') return;
        const ac = (el.getAttribute('autocomplete') || '').toLowerCase();
        if (ac !== 'off') return;
        el.setAttribute('autocomplete', 'off');
        el.setAttribute('autocorrect', 'off');
        el.setAttribute('autocapitalize', 'none');
        el.setAttribute('spellcheck', 'false');
        el.setAttribute('data-lpignore', 'true');
        el.setAttribute('data-1p-ignore', 'true');
        el.setAttribute('data-form-type', 'other');
        if (!el.getAttribute('name') || el.getAttribute('name') === 'on') {
          el.setAttribute('name', 'mg-nofill-' + Math.random().toString(36).slice(2, 8));
        }
      }

      const obs = new MutationObserver(function (mutations) {
        for (let i = 0; i < mutations.length; i++) {
          const m = mutations[i];
          if (m.type === 'attributes' && m.target) {
            hardenOffAutofill(m.target);
          }
          const nodes = m.addedNodes;
          for (let j = 0; j < nodes.length; j++) {
            const n = nodes[j];
            if (n.nodeType !== 1) continue;
            hardenOffAutofill(n);
            if (n.querySelectorAll) {
              const list = n.querySelectorAll('input,textarea');
              for (let k = 0; k < list.length; k++) hardenOffAutofill(list[k]);
            }
          }
        }
      });
      obs.observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['autocomplete'],
      });
    })();
  </script>
</body>
</html>
