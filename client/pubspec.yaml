name: multigames_client
description: Multiplatform online mini-games — Flutter client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  flutter_slidable: ^4.0.3
  animated_emoji: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: web/assets/fonts/MaterialIcons-Regular.woff2
  # Анимированные смайлики магазина — бандл приложения (без сети).
