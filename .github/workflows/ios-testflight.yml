# Один workflow iOS TestFlight:
#   job release — macos, собирает IPA и заливает
#   job link    — ubuntu, печатает ссылку join/… и шлёт Beta Review
#   push develop → dev, push main → prod
#   Run workflow → «только ссылка» — без новой IPA
#
# Секреты: APP_STORE_CONNECT_* + APPLE_TEAM_ID + MATCH_PASSWORD
# Setup: docs/IOS_TESTFLIGHT.md

name: iOS TestFlight

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Flavor / API (dev или prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      force_match:
        description: 'Пересоздать сертификат/профиль (если match сломался)'
        required: false
        default: false
        type: boolean
      code_only:
        description: 'Только ссылка / Review, без новой IPA'
        required: false
        default: false
        type: boolean

# develop и main не отменяют друг друга (разные Bundle ID / flavor).
concurrency:
  group: ios-testflight-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.code_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip ipa]')) }}
    runs-on: macos-26
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client/ios
    steps:
      - name: Resolve target
        id: target
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TARGET="prod"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            TARGET="dev"
          else
            echo "Неизвестная ветка: ${{ github.ref_name }}"
            exit 1
          fi

          if [[ "$TARGET" == "prod" ]]; then
            API_BASE="https://multigameszozu.fly.dev"
            BUNDLE_ID="com.zozugames.app"
            FLAVOR="prod"
          else
            API_BASE="https://multigameszozu-dev.fly.dev"
            BUNDLE_ID="com.zozugames.app.dev"
            FLAVOR="dev"
          fi

          BUILD_NUMBER=$((10000 + ${{ github.run_number }}))
          # CFBundleShortVersionString: не больше трёх чисел (не 0.1.0-dev.10).
          BUILD_NAME="0.1.0"
          if [[ ! "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::BUILD_NAME должен быть три числа (например 0.1.0), сейчас $BUILD_NAME"
            exit 1
          fi
          BUILD_ID="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          APP_VERSION="${BUILD_NAME}+${BUILD_NUMBER}"

          {
            echo "target=$TARGET"
            echo "flavor=$FLAVOR"
            echo "api_base=$API_BASE"
            echo "bundle_id=$BUNDLE_ID"
            echo "build_number=$BUILD_NUMBER"
            echo "build_name=$BUILD_NAME"
            echo "build_id=$BUILD_ID"
            echo "app_version=$APP_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "TestFlight: branch=${{ github.ref_name }} → $TARGET flavor=$FLAVOR bundle=$BUNDLE_ID"
          echo "API_BASE=$API_BASE version=$APP_VERSION BUILD_ID=$BUILD_ID"

      - name: Check required secrets
        working-directory: .
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY APPLE_TEAM_ID MATCH_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Нет секрета $name — открой docs/IOS_TESTFLIGHT.md (раздел «Без Mac») и добавь Secrets в GitHub"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID должен быть 10 символов (Membership Details), сейчас длина ${#APPLE_TEAM_ID}"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Select Xcode 26
        working-directory: .
        run: |
          set -euo pipefail
          ls /Applications | grep -i xcode || true
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.app /Applications/Xcode.app; do
            if [ -d "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            selected="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$selected" ] || [ ! -d "$selected" ]; then
            echo "::error::На раннере нет Xcode 26 — App Store требует iOS 26 SDK с апреля 2026"
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version
          version="$(xcodebuild -version | head -1)"
          if [[ ! "$version" =~ ^Xcode\ 26 ]]; then
            echo "::error::Нужен Xcode 26 (iOS 26 SDK), сейчас: $version"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: client
        run: flutter pub get

      - name: Write GoogleService-Info.plist (optional FCM)
        working-directory: client
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_DEV: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_DEV }}
        shell: bash
        run: |
          set -euo pipefail
          flavor="${{ steps.target.outputs.flavor }}"
          bundle="${{ steps.target.outputs.bundle_id }}"
          plist="${IOS_GOOGLE_SERVICE_INFO_PLIST:-}"
          if [[ "$flavor" == "dev" && -n "${IOS_GOOGLE_SERVICE_INFO_PLIST_DEV:-}" ]]; then
            plist="$IOS_GOOGLE_SERVICE_INFO_PLIST_DEV"
          fi
          if [[ -z "$plist" ]]; then
            echo "No GoogleService-Info.plist secret — closed-app FCM will be off in this IPA"
            exit 0
          fi
          if ! printf '%s' "$plist" | grep -Fq "<string>${bundle}</string>"; then
            echo "GoogleService-Info.plist has no BUNDLE_ID ${bundle} — skip FCM for $flavor"
            exit 0
          fi
          printf '%s' "$plist" > ios/Runner/GoogleService-Info.plist
          echo "Wrote ios/Runner/GoogleService-Info.plist"

      - name: Write App Store Connect API key
        working-directory: .
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$APP_STORE_CONNECT_API_KEY"
          raw="${raw//$'\r'/}"
          raw="${raw#\"}"
          raw="${raw%\"}"
          raw="${raw#\'}"
          raw="${raw%\'}"
          if [[ "$raw" == *'\n'* ]]; then
            raw="${raw//\\n/$'\n'}"
          fi
          if [[ ${#raw} -lt 40 ]]; then
            echo "::error::APP_STORE_CONNECT_API_KEY слишком короткий (${#raw} символов) — похоже вставлен Key ID, а не файл .p8"
            exit 1
          fi
          if printf '%s' "$raw" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$raw" > "$RUNNER_TEMP/AuthKey.p8"
          else
            {
              echo '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$raw" | tr -d ' \t\n' | fold -w 64
              echo
              echo '-----END PRIVATE KEY-----'
            } > "$RUNNER_TEMP/AuthKey.p8"
            echo "Wrapped raw key body with PEM headers"
          fi
          test -s "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"
          echo "AuthKey.p8 bytes=$(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build IPA and upload to TestFlight
        working-directory: client/ios
        env:
          FLAVOR: ${{ steps.target.outputs.flavor }}
          BUNDLE_ID: ${{ steps.target.outputs.bundle_id }}
          API_BASE: ${{ steps.target.outputs.api_base }}
          BUILD_NUMBER: ${{ steps.target.outputs.build_number }}
          BUILD_NAME: ${{ steps.target.outputs.build_name }}
          BUILD_ID: ${{ steps.target.outputs.build_id }}
          APP_VERSION: ${{ steps.target.outputs.app_version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_FILE: ${{ runner.temp }}/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
          MATCH_GIT_BRANCH: match-certs
          MATCH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_match || false }}
          MATCH_READONLY: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MATCH_GIT_BASIC_AUTHORIZATION="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export MATCH_GIT_BASIC_AUTHORIZATION
          fastlane ios beta

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ios-${{ steps.target.outputs.flavor }}-${{ steps.target.outputs.build_number }}
          path: client/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

  link:
    needs: [release]
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/ios
    steps:
      - name: Resolve target
        id: target
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TARGET="prod"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            TARGET="dev"
          else
            echo "Неизвестная ветка: ${{ github.ref_name }}"
            exit 1
          fi
          if [[ "$TARGET" == "prod" ]]; then
            BUNDLE_ID="com.zozugames.app"
          else
            BUNDLE_ID="com.zozugames.app.dev"
          fi
          {
            echo "target=$TARGET"
            echo "bundle_id=$BUNDLE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "TestFlight link: $TARGET $BUNDLE_ID"

      - name: Check required secrets
        working-directory: .
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Нет секрета $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Write App Store Connect API key
        working-directory: .
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$APP_STORE_CONNECT_API_KEY"
          raw="${raw//$'\r'/}"
          raw="${raw#\"}"
          raw="${raw%\"}"
          raw="${raw#\'}"
          raw="${raw%\'}"
          if [[ "$raw" == *'\n'* ]]; then
            raw="${raw//\\n/$'\n'}"
          fi
          if printf '%s' "$raw" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$raw" > "$RUNNER_TEMP/AuthKey.p8"
          else
            {
              echo '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$raw" | tr -d ' \t\n' | fold -w 64
              echo
              echo '-----END PRIVATE KEY-----'
            } > "$RUNNER_TEMP/AuthKey.p8"
          fi
          test -s "$RUNNER_TEMP/AuthKey.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: 'none'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Print TestFlight link
        working-directory: client/ios
        env:
          BUNDLE_ID: ${{ steps.target.outputs.bundle_id }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_FILE: ${{ runner.temp }}/AuthKey.p8
          TESTFLIGHT_GROUP: Redeem
        shell: bash
        run: |
          set -euo pipefail
          fastlane ios public_code
