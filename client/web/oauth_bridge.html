<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #E8ECF4;
      color: #1a1a2e;
    }
  </style>
</head>
<body>
  <p>Вход…</p>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var data = {};
      params.forEach(function (v, k) { data[k] = v; });
      try {
        localStorage.setItem('mg_oauth_result', JSON.stringify(data));
      } catch (e) {}
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: 'mg_oauth', data: data }, location.origin);
        }
      } catch (e) {}
      // Popup: закрываем и возвращаем управление в PWA.
      var isPopup = false;
      try {
        isPopup = !!(window.opener && !window.opener.closed) || window.name === 'mg_oauth';
      } catch (e) {}
      if (isPopup) {
        try { window.close(); } catch (e) {}
        setTimeout(function () {
          location.replace('/oauth/callback' + location.search);
        }, 400);
        return;
      }
      // Обычный редирект (не PWA popup) — Flutter-экран колбэка.
      location.replace('/oauth/callback' + location.search);
    })();
  </script>
</body>
</html>
