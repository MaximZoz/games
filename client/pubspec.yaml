name: multigames_client
description: Multiplatform online mini-games — Flutter client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  http: ^1.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  flutter_slidable: ^4.0.3
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  web: ^1.1.1
  image: ^4.3.0
  material_symbols_icons: ^4.2960.0
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: web/assets/fonts/MaterialIcons-Regular.woff2
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
  # Смайлики, флаги и масти карт — локальный бандл (не системный emoji-шрифт).
  assets:
    - assets/flags/
    - assets/suits/
    - assets/emojis/lottie/
    - assets/emojis/static/
    - assets/emojis/unicode.json
    - assets/sfx/
