# Dev-окружение MultiGames на Fly.io (копия прод-стека, отдельное приложение).
# Прод: fly.toml → multigameszozu
# Dev:  fly.dev.toml → multigameszozu-dev
#
# Создать ресурсы: ./launcher/setup_fly_dev.sh
# Задеплоить:      ./launcher/deploy_dev.sh

app = 'multigameszozu-dev'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  APP_ENV = 'development'

[http_service]
  internal_port = 8080
  force_https = true
  # Как на проде: не глушить единственную машину. При auto_stop=stop
  # fly deploy считает состояние stopped успехом и не ждёт процесс.
  # Прокси тогда принимает TLS и не отдаёт /api/start (curl 28, 0 bytes).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/start'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
