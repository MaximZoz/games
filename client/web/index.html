<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="multigames_client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>multigames_client</title>
  <link rel="manifest" href="manifest.json">
  <!-- Telegram Mini App SDK: нужен для expand/disableVerticalSwipes -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* 100dvh стабильнее в Telegram WebView, чем 100% */
      height: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
    }
    body {
      background-color: #F5F5F5;
      /* Только вертикальный pan — меньше шансов отдать жест Telegram-оболочке */
      touch-action: pan-y;
      position: fixed;
      inset: 0;
    }
    flt-glass-pane, flutter-view {
      display: block;
      width: 100%;
      height: 100%;
      overscroll-behavior: none;
      touch-action: pan-y;
    }
    flt-glass-pane canvas, flutter-view canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      // Telegram Mini App: разворачиваем на весь экран и отключаем
      // вертикальные свайпы сворачивания (Bot API 7.7+), чтобы скролл
      // списков (чаты/друзья) не закрывал bottom sheet.
      function configureTelegramMiniApp() {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return false;
        try {
          if (typeof tg.ready === 'function') tg.ready();
          if (typeof tg.expand === 'function') tg.expand();
          if (typeof tg.disableVerticalSwipes === 'function') {
            tg.disableVerticalSwipes();
          }
          return true;
        } catch (_) {
          return false;
        }
      }

      configureTelegramMiniApp();
      // Повтор после загрузки Flutter — на части клиентов WebApp
      // становится доступен чуть позже.
      window.addEventListener('load', configureTelegramMiniApp);
      setTimeout(configureTelegramMiniApp, 0);
      setTimeout(configureTelegramMiniApp, 250);
      setTimeout(configureTelegramMiniApp, 1000);

      let startX = 0;
      let startY = 0;
      document.addEventListener('touchstart', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const x = e.touches[0].clientX;
        startX = x;
        startY = e.touches[0].clientY;
        // Блокируем системный свайп "назад/вперёд" от краёв экрана на iOS.
        if (x <= 24 || x >= window.innerWidth - 24) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchmove', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 && dx > dy) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
