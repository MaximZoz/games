# fly.toml app configuration file generated for multigameszozu on 2026-02-16T01:22:59+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'multigameszozu'
# arn=Stockholm, ams=Amsterdam, fra=Frankfurt, ist=Istanbul
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Не глушить единственную машину: cold start + multi-poll валят health.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    # Раньше 80/100: при multi + логах + ретраях упирались в hard_limit → PR01.
    hard_limit = 400
    soft_limit = 300

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/start'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
