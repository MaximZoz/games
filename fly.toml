# fly.toml app configuration file generated for multigameszozu on 2026-02-16T01:22:59+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'multigameszozu'
# arn=Stockholm, ams=Amsterdam, fra=Frankfurt, ist=Istanbul
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/start'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
