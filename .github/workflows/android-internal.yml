# Авторелиз Android AAB в Google Play Internal testing:
#   push в develop → flavor dev  → com.zozugames.app.dev  + DEV API
#   push в main    → flavor prod → com.zozugames.app      + prod API
#
# Два applicationId → оба приложения могут стоять на телефоне одновременно.
# Для DEV в Play Console нужно ОТДЕЛЬНОЕ приложение с package
# com.zozugames.app.dev (SA с правом Release to testing tracks).
#
# Секреты: ANDROID_KEYSTORE_* + PLAY_SERVICE_ACCOUNT_JSON
# Setup: docs/ANDROID_PLAY_INTERNAL.md

name: Android Play Internal

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/android-internal.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Flavor / API (dev или prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# develop и main не отменяют друг друга (разные package / flavor).
concurrency:
  group: android-play-internal-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - name: Resolve target
        id: target
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            TARGET="prod"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            TARGET="dev"
          else
            echo "Неизвестная ветка: ${{ github.ref_name }}"
            exit 1
          fi

          if [[ "$TARGET" == "prod" ]]; then
            API_BASE="https://multigameszozu.fly.dev"
            PACKAGE_NAME="com.zozugames.app"
            FLAVOR="prod"
          else
            API_BASE="https://multigameszozu-dev.fly.dev"
            PACKAGE_NAME="com.zozugames.app.dev"
            FLAVOR="dev"
          fi

          # versionCode должен расти и быть > уже залитых в Play (локальный +1).
          VERSION_CODE=$((10000 + ${{ github.run_number }}))
          VERSION_NAME="0.1.0-${TARGET}.${{ github.run_number }}"
          RELEASE_NAME="internal-${TARGET}-${VERSION_CODE}"
          BUILD_ID="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          APP_VERSION="${VERSION_NAME}+${VERSION_CODE}"
          # Flutter flavor output: build/app/outputs/bundle/<flavor>Release/app-<flavor>-release.aab
          AAB_PATH="build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab"

          {
            echo "target=$TARGET"
            echo "flavor=$FLAVOR"
            echo "api_base=$API_BASE"
            echo "package_name=$PACKAGE_NAME"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "release_name=$RELEASE_NAME"
            echo "build_id=$BUILD_ID"
            echo "app_version=$APP_VERSION"
            echo "aab_path=$AAB_PATH"
          } >> "$GITHUB_OUTPUT"

          echo "Play Internal: branch=${{ github.ref_name }} → $TARGET flavor=$FLAVOR package=$PACKAGE_NAME"
          echo "API_BASE=$API_BASE version=$APP_VERSION BUILD_ID=$BUILD_ID"

      - name: Check required secrets
        working-directory: .
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret: $name — см. docs/ANDROID_PLAY_INTERNAL.md"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Decode keystore + key.properties
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          # Убрать CR/LF/пробелы — частая причина base64: invalid input из Secrets UI.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > upload-keystore.jks
          test -s upload-keystore.jks
          echo "keystore bytes=$(wc -c < upload-keystore.jks)"
          printf '%s\n' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            "storeFile=../upload-keystore.jks" \
            > key.properties
          grep -q '^keyAlias=' key.properties

      - name: Write google-services.json (optional FCM)
        working-directory: client
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          ANDROID_GOOGLE_SERVICES_JSON_DEV: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_DEV }}
        shell: bash
        run: |
          set -euo pipefail
          flavor="${{ steps.target.outputs.flavor }}"
          json="${ANDROID_GOOGLE_SERVICES_JSON:-}"
          if [[ "$flavor" == "dev" && -n "${ANDROID_GOOGLE_SERVICES_JSON_DEV:-}" ]]; then
            json="$ANDROID_GOOGLE_SERVICES_JSON_DEV"
          fi
          if [[ -z "$json" ]]; then
            echo "No google-services.json secret — closed-app FCM will be off in this AAB"
            exit 0
          fi
          mkdir -p "android/app/src/${flavor}"
          printf '%s' "$json" > "android/app/src/${flavor}/google-services.json"
          echo "Wrote android/app/src/${flavor}/google-services.json"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build app bundle
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --flavor="${{ steps.target.outputs.flavor }}" \
            --build-number="${{ steps.target.outputs.version_code }}" \
            --build-name="${{ steps.target.outputs.version_name }}" \
            --dart-define="API_BASE=${{ steps.target.outputs.api_base }}" \
            --dart-define="BUILD_ID=${{ steps.target.outputs.build_id }}" \
            --dart-define="APP_VERSION=${{ steps.target.outputs.app_version }}" \
            --dart-define="ANDROID_APPLICATION_ID=${{ steps.target.outputs.package_name }}"
          ls -lh "${{ steps.target.outputs.aab_path }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.target.outputs.flavor }}-${{ steps.target.outputs.version_code }}
          path: client/${{ steps.target.outputs.aab_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Play Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.target.outputs.package_name }}
          releaseFiles: client/${{ steps.target.outputs.aab_path }}
          tracks: internal
          status: completed
          releaseName: ${{ steps.target.outputs.release_name }}
          # Не ставить changesNotSentForReview: у аккаунтов с автоотправкой
          # на review Play отвечает: "must not be set".
