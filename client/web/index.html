<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zozu Games — online mini-games">

  <!-- iOS meta tags & icons (PWA / Web Push: нужна установка на «Домой») -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent: контент под status bar; фон body совпадает с панелью -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zozu Games">
  <meta name="theme-color" content="#E8ECF4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zozu Games</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      /* После splash — цвет шапки/низа приложения */
      background-color: #E8ECF4;
    }
    body {
      background-color: #E8ECF4;
      touch-action: pan-y;
    }
    flt-glass-pane, flutter-view, flt-scene-host {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #E8ECF4;
    }
    flt-glass-pane canvas, flutter-view canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ——— Boot splash (до первого кадра Flutter) ——— */
    #zozu-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Фон анимации = surfaceUnified приложения */
      background-color: #E8ECF4;
      background-image:
        radial-gradient(ellipse 55% 45% at 22% 32%, rgba(165, 180, 252, 0.22), transparent 70%),
        radial-gradient(ellipse 50% 40% at 78% 58%, rgba(196, 181, 253, 0.18), transparent 70%),
        radial-gradient(ellipse 40% 35% at 50% 78%, rgba(147, 197, 253, 0.12), transparent 70%);
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    #zozu-boot.is-leaving {
      opacity: 0;
    }
    /* До Flutter — собранный бренд с дыханием; полная анимация букв в Flutter. */
    #zozu-boot .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      transform: translateY(-2vh);
      animation: zozu-breathe 2.8s ease-in-out infinite;
    }
    #zozu-boot .zozu {
      display: flex;
      font-family: "Syne", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(42px, 12vw, 78px);
      line-height: 1;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 35%, #8B5CF6 70%, #A78BFA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #zozu-boot .line {
      width: min(42vw, 180px);
      height: 2.5px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, #6366F1 28%, #8B5CF6 72%, transparent);
    }
    #zozu-boot .games {
      display: flex;
      gap: 0.42em;
      font-family: "Syne", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(16px, 4.2vw, 28px);
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: rgba(0, 0, 0, 0.78);
      text-transform: uppercase;
    }
    @keyframes zozu-breathe {
      0%, 100% { transform: translateY(-2vh) scale(1); opacity: 1; }
      50% { transform: translateY(-2vh) scale(1.02); opacity: 0.92; }
    }
  </style>
</head>
<body>
  <div id="zozu-boot" aria-hidden="true">
    <div class="brand">
      <div class="zozu" aria-label="Zozu">
        <span>Z</span><span>o</span><span>z</span><span>u</span>
      </div>
      <div class="line"></div>
      <div class="games" aria-label="Games">
        <span>G</span><span>a</span><span>m</span><span>e</span><span>s</span>
      </div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      function hideBoot() {
        var el = document.getElementById('zozu-boot');
        if (!el || el.classList.contains('is-leaving')) return;
        el.classList.add('is-leaving');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 480);
      }
      // Flutter web fires this when the first frame is painted.
      window.addEventListener('flutter-first-frame', hideBoot, { once: true });
      // Fallback if the event is missed (old embed / race).
      setTimeout(hideBoot, 8000);

      let startX = 0;
      let startY = 0;
      document.addEventListener('touchstart', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const x = e.touches[0].clientX;
        startX = x;
        startY = e.touches[0].clientY;
        // Блокируем системный свайп "назад/вперёд" от краёв экрана на iOS.
        if (x <= 24 || x >= window.innerWidth - 24) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchmove', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 && dx > dy) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
    })();
  </script>
</body>
</html>
