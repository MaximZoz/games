<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zozu Games">
  <title>Zozu Games</title>
  <desc>Shirt and tie that doubles as a night sky with a UFO between snowy peaks</desc>
  <defs>
    <linearGradient id="jacket" x1="256" y1="40" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="arrowL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="arrowR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.58" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Jacket with shirt V-notch (white = collar; secondarily snow peaks) -->
  <path fill="url(#jacket)" d="
    M 88 112
    C 88 64 124 40 168 40
    H 344
    C 388 40 424 64 424 112
    V 300
    L 280 472
    L 256 430
    L 232 472
    L 88 300
    Z
  "/>

  <!-- Brand accent hairlines (toolbar arrows) -->
  <rect x="108" y="268" width="72" height="7" rx="3.5" fill="url(#arrowL)"/>
  <rect x="332" y="268" width="72" height="7" rx="3.5" fill="url(#arrowR)"/>

  <!-- Tie / night sky -->
  <path fill="#1E1B4B" d="
    M 226 64
    C 234 52 246 48 256 48
    C 266 48 278 52 286 64
    L 304 118
    L 278 148
    L 310 250
    L 286 290
    L 318 350
    L 256 455
    L 194 350
    L 226 290
    L 202 250
    L 234 148
    L 208 118
    Z
  "/>

  <!-- Knot -->
  <path fill="#24205A" d="M 238 118 L 256 106 L 274 118 L 256 134 Z"/>

  <!-- UFO easter egg (low contrast) -->
  <g opacity="0.55">
    <ellipse cx="256" cy="200" rx="28" ry="9" fill="#3A3672"/>
    <ellipse cx="256" cy="192" rx="11" ry="9" fill="#322E66"/>
    <circle cx="240" cy="202" r="2.2" fill="#2C285C"/>
    <circle cx="256" cy="203" r="2.2" fill="#2C285C"/>
    <circle cx="272" cy="202" r="2.2" fill="#2C285C"/>
  </g>
</svg>
