<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=2">
  <title>Вход выполнен</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #E8ECF4;
      color: #1a1a2e;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(30, 40, 80, 0.08);
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0; color: #5a6275; line-height: 1.45; }
    a.stay {
      display: inline-block;
      margin-top: 16px;
      color: #5a6275;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Готово</h1>
    <p id="msg">Возвращаем в приложение…</p>
    <a class="stay" id="stay" href="#" hidden>Продолжить в браузере</a>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var err = params.get('error');
      var state = params.get('state') || '';
      var fromPwa = params.get('pwa') === '1';

      function isStandalone() {
        try {
          if (window.matchMedia('(display-mode: standalone)').matches) return true;
          if (window.matchMedia('(display-mode: fullscreen)').matches) return true;
        } catch (e) {}
        try {
          if (typeof navigator.standalone === 'boolean' && navigator.standalone) return true;
        } catch (e) {}
        return false;
      }

      function loginUrl() {
        var q = 'oauth=1';
        if (state) q += '&state=' + encodeURIComponent(state);
        if (err) q += '&error=' + encodeURIComponent(err);
        return '/login?' + q;
      }

      var stay = document.getElementById('stay');
      stay.href = loginUrl();

      if (err) {
        document.getElementById('title').textContent = 'Ошибка входа';
        document.getElementById('msg').textContent = err + '. Сейчас вернём на экран входа.';
      }

      // Standalone PWA — poll в том же окне.
      if (isStandalone()) {
        location.replace(loginUrl());
        return;
      }

      // Старт был из установленной PWA: не грузим Flutter в Safari,
      // иначе токены осядут в браузере, а иконка на «Домой» останется без сессии.
      if (fromPwa) {
        document.getElementById('title').textContent = err ? 'Ошибка входа' : 'Готово';
        document.getElementById('msg').textContent = err
          ? (err + '. Закройте это окно и откройте Zozu Games с экрана «Домой».')
          : 'Откройте Zozu Games с экрана «Домой» — вход завершится автоматически. Это окно можно закрыть.';
        stay.hidden = false;
        try { window.close(); } catch (e) {}
        return;
      }

      if (err) {
        setTimeout(function () { location.replace(loginUrl()); }, 900);
        return;
      }
      location.replace(loginUrl());
    })();
  </script>
</body>
</html>
