<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-content: меньше рассинхрона hit-test при клавиатуре (Chrome/Android). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zozu Games — online mini-games">

  <!-- iOS meta tags & icons (PWA / Web Push: нужна установка на «Домой») -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    ВАЖНО: не black-translucent.
    На iOS PWA translucent даёт укороченный layout viewport и сдвиг hit-test
    («кнопки жмутся сверху», пока не ткнёшь в TextField).
    Meta читается при Add to Home Screen — после смены удалите иконку и добавьте снова.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zozu Games">
  <meta name="theme-color" content="#E8ECF4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Zozu Games</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      /* 100% + black-translucent ломали viewport; 100dvh — реальная высота экрана */
      height: 100%;
      height: 100dvh;
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      overflow-x: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      background-color: #E8ECF4;
    }
    body {
      background-color: #E8ECF4;
      touch-action: pan-y;
      position: relative;
    }
    flt-glass-pane, flutter-view, flt-scene-host {
      display: block;
      width: 100%;
      height: 100%;
      background-color: #E8ECF4;
    }
    flt-glass-pane canvas, flutter-view canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ——— Boot splash (до первого кадра Flutter) ——— */
    #zozu-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Фон анимации = surfaceUnified приложения */
      background-color: #E8ECF4;
      background-image:
        radial-gradient(ellipse 55% 45% at 22% 32%, rgba(165, 180, 252, 0.22), transparent 70%),
        radial-gradient(ellipse 50% 40% at 78% 58%, rgba(196, 181, 253, 0.18), transparent 70%),
        radial-gradient(ellipse 40% 35% at 50% 78%, rgba(147, 197, 253, 0.12), transparent 70%);
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    #zozu-boot.is-leaving {
      opacity: 0;
    }
    /* До Flutter — собранный бренд с дыханием; полная анимация букв в Flutter. */
    #zozu-boot .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      transform: translateY(-2vh);
      animation: zozu-breathe 2.8s ease-in-out infinite;
    }
    #zozu-boot .zozu {
      display: flex;
      font-family: "Syne", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(42px, 12vw, 78px);
      line-height: 1;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 35%, #8B5CF6 70%, #A78BFA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #zozu-boot .games-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55em;
    }
    #zozu-boot .line {
      width: clamp(28px, 8vw, 56px);
      height: 2.5px;
      border-radius: 99px;
      flex-shrink: 0;
      transform-origin: center;
      animation: zozu-line-draw 0.78s cubic-bezier(0.33, 1, 0.68, 1) both;
    }
    #zozu-boot .line-left {
      background: linear-gradient(90deg, transparent, #6366F1 42%, #8B5CF6 100%);
      transform-origin: right center;
      animation-delay: 0.12s;
    }
    #zozu-boot .line-right {
      background: linear-gradient(90deg, #8B5CF6 0%, #6366F1 58%, transparent);
      transform-origin: left center;
      animation-delay: 0.2s;
    }
    #zozu-boot .games {
      display: flex;
      gap: 0.42em;
      font-family: "Syne", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(16px, 4.2vw, 28px);
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: rgba(0, 0, 0, 0.78);
      text-transform: uppercase;
    }
    @keyframes zozu-breathe {
      0%, 100% { transform: translateY(-2vh) scale(1); opacity: 1; }
      50% { transform: translateY(-2vh) scale(1.02); opacity: 0.92; }
    }
    @keyframes zozu-line-draw {
      0% { opacity: 0; transform: scaleX(0.08); }
      100% { opacity: 1; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div id="zozu-boot" aria-hidden="true">
    <div class="brand">
      <div class="zozu" aria-label="Zozu">
        <span>Z</span><span>o</span><span>z</span><span>u</span>
      </div>
      <div class="games-row" aria-label="Games">
        <div class="line line-left" aria-hidden="true"></div>
        <div class="games">
          <span>G</span><span>a</span><span>m</span><span>e</span><span>s</span>
        </div>
        <div class="line line-right" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Ранняя регистрация push SW (до Flutter) — критично для iOS PWA.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/push-sw.js?v=7', { scope: '/' }).catch(function () {});
    }
  </script>
  <script>
    // Google Identity Services — вход в той же вкладке (One Tap / FedCM), без popup/Safari.
    window.__mgGoogleSignIn = function (clientId) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        function cleanup() {
          var el = document.getElementById('mg-gsi-host');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }
        function ok(cred) {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(cred);
        }
        function fail(msg) {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error(msg || 'google sign-in failed'));
        }
        function onCred(resp) {
          if (resp && resp.credential) ok(resp.credential);
          else fail('no credential');
        }
        // Запасной путь: официальная кнопка Google в странице (не модалка и не новое окно).
        function showInlineButton() {
          if (settled || document.getElementById('mg-gsi-host')) return;
          var host = document.createElement('div');
          host.id = 'mg-gsi-host';
          host.style.cssText =
            'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:2147483646;' +
            'display:flex;flex-direction:column;align-items:center;gap:8px;';
          var btnWrap = document.createElement('div');
          btnWrap.id = 'mg-gsi-btn';
          var cancel = document.createElement('button');
          cancel.type = 'button';
          cancel.textContent = 'Отмена';
          cancel.style.cssText =
            'border:0;background:transparent;color:#555;font:500 13px system-ui,-apple-system,sans-serif;cursor:pointer';
          cancel.onclick = function () { fail('cancelled'); };
          host.appendChild(btnWrap);
          host.appendChild(cancel);
          document.body.appendChild(host);
          try {
            google.accounts.id.renderButton(btnWrap, {
              theme: 'outline',
              size: 'large',
              shape: 'rectangular',
              text: 'signin_with',
              width: 280,
              locale: 'ru'
            });
          } catch (e) {
            fail(String(e));
          }
        }
        function start() {
          try {
            google.accounts.id.initialize({
              client_id: clientId,
              callback: onCred,
              auto_select: true,
              cancel_on_tap_outside: true,
              use_fedcm_for_prompt: true,
              itp_support: true
            });
            google.accounts.id.prompt(function (notification) {
              try {
                if (notification.isDismissedMoment && notification.isDismissedMoment()) {
                  var reason = '';
                  try { reason = notification.getDismissedReason() || ''; } catch (e) {}
                  if (reason === 'credential_returned') return;
                  fail('cancelled');
                  return;
                }
                if (
                  (notification.isNotDisplayed && notification.isNotDisplayed()) ||
                  (notification.isSkippedMoment && notification.isSkippedMoment())
                ) {
                  showInlineButton();
                }
              } catch (e) {
                showInlineButton();
              }
            });
          } catch (e) {
            fail(String(e));
          }
        }
        if (window.google && google.accounts && google.accounts.id) {
          start();
          return;
        }
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onload = start;
        s.onerror = function () {
          fail('gsi load failed');
        };
        document.head.appendChild(s);
      });
    };
  </script>
  <script>
    (function () {
      function hideBoot() {
        var el = document.getElementById('zozu-boot');
        if (!el || el.classList.contains('is-leaving')) return;
        el.classList.add('is-leaving');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 480);
      }
      // Flutter web fires this when the first frame is painted.
      window.addEventListener('flutter-first-frame', hideBoot, { once: true });
      // Fallback if the event is missed (old embed / race).
      setTimeout(hideBoot, 8000);

      // iOS PWA/Safari: visualViewport.offsetTop ≠ 0 → Flutter рисует ниже,
      // а hit-test остаётся выше («кнопки жмутся сверху»). Фокус в input
      // случайно чинит это через resize — делаем то же явно.
      function syncIosViewport() {
        try {
          if (window.scrollX !== 0 || window.scrollY !== 0) {
            window.scrollTo(0, 0);
          }
          var vv = window.visualViewport;
          if (vv && (vv.offsetTop !== 0 || vv.pageTop !== 0)) {
            window.scrollTo(0, 0);
          }
          window.dispatchEvent(new Event('resize'));
        } catch (e) {}
      }
      window.addEventListener('load', syncIosViewport);
      window.addEventListener('pageshow', syncIosViewport);
      window.addEventListener('orientationchange', function () {
        setTimeout(syncIosViewport, 50);
        setTimeout(syncIosViewport, 300);
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') syncIosViewport();
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncIosViewport);
        window.visualViewport.addEventListener('scroll', syncIosViewport);
      }
      window.addEventListener('flutter-first-frame', function () {
        syncIosViewport();
        setTimeout(syncIosViewport, 50);
        setTimeout(syncIosViewport, 250);
        setTimeout(syncIosViewport, 800);
      });
      // Перед первым жестом — ещё один sync (если PWA открыли «криво»).
      document.addEventListener('touchstart', function onFirstTouch() {
        syncIosViewport();
        document.removeEventListener('touchstart', onFirstTouch, true);
      }, { capture: true, passive: true });

      let startX = 0;
      let startY = 0;
      document.addEventListener('touchstart', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const x = e.touches[0].clientX;
        startX = x;
        startY = e.touches[0].clientY;
        // Блокируем системный свайп "назад/вперёд" от краёв экрана на iOS.
        if (x <= 24 || x >= window.innerWidth - 24) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });

      document.addEventListener('touchmove', function (e) {
        if (!e.touches || e.touches.length === 0) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > 8 && dx > dy) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
    })();
  </script>
</body>
</html>
